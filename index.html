<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPSC TRE PYQ - GS | Question 39</title>
<style>
:root{--bg:#f2f6ff;--panel:#fff;--text:#17345e;--muted:#61738d;--line:#d5dfec;--accent:#17427c;--accent2:#2563eb;--good:#dcfce7;--goodText:#166534;--bad:#fee2e2;--badText:#991b1b;--soft:#e5edfa}
*{box-sizing:border-box}
body{margin:0;padding:22px 14px;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#e8edf5;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:var(--text)}
body.night{--bg:#111827;--panel:#1f2937;--text:#f8fafc;--muted:#cbd5e1;--line:#475569;--accent:#bfdbfe;--accent2:#60a5fa;--good:#17432f;--goodText:#bbf7d0;--bad:#4a2025;--badText:#fecaca;--soft:#25344a;background:#080e19}
.wrap{width:min(100%,620px);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,30px);box-shadow:0 12px 35px #14213b18}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:clamp(25px,5vw,34px);margin:0;color:var(--accent);letter-spacing:.3px}
.sub{margin:5px 0 0;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:700}
.theme{background:var(--soft);color:var(--text);white-space:nowrap;border:1px solid var(--line)}
hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.tag{display:inline-block;background:#dbeafe;color:#1d4ed8;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800}
body.night .tag{background:#1e3a5f;color:#bfdbfe}
.question{font-size:clamp(20px,4.5vw,27px);line-height:1.6;margin:16px 0 20px;font-weight:700}
.options{display:grid;gap:11px}
.option{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);color:var(--text);border:1.5px solid var(--line);padding:15px 16px;border-radius:13px;transition:.15s}
.option:hover{border-color:var(--accent2);transform:translateY(-1px)}
.letter{font-weight:800;min-width:27px}
.option.correct{background:var(--good);border-color:#16a34a;color:var(--goodText)}
.option.wrong{background:var(--bad);border-color:#dc2626;color:var(--badText)}
.mark{margin-left:auto;font-size:19px;font-weight:900}
.feedback,.explanation{margin-top:15px;padding:15px;border-radius:13px;line-height:1.55}
.feedback.good{background:var(--good);color:var(--goodText)}
.feedback.bad{background:var(--bad);color:var(--badText)}
.explanation{background:var(--soft);color:var(--text)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.primary{background:var(--accent2);color:white}
.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}
.footer{text-align:center;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.5px;margin-top:22px}
.hidden{display:none}
@media(max-width:390px){.actions{grid-template-columns:1fr}.theme{padding:10px}.wrap{padding:17px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <h1>BPSC TRE PYQ</h1>
      <p class="sub">GENERAL STUDIES (GS)</p>
    </div>
    <button class="theme" id="themeBtn" type="button">🌙 Night</button>
  </header>
  <hr>
  <span class="tag">QUESTION 39</span>
  <section class="question">आदित्य-L1 उपग्रह का सूर्य अवलोकन बिन्दु है</section>
  <section class="options" id="options" aria-label="Answer options">
    <button class="option" data-answer="A"><span class="letter">(A)</span><span>L1</span><span class="mark"></span></button>
    <button class="option" data-answer="B"><span class="letter">(B)</span><span>L2</span><span class="mark"></span></button>
    <button class="option" data-answer="C"><span class="letter">(C)</span><span>L3</span><span class="mark"></span></button>
    <button class="option" data-answer="D"><span class="letter">(D)</span><span>उपर्युक्त में से एक से अधिक</span><span class="mark"></span></button>
    <button class="option" data-answer="E"><span class="letter">(E)</span><span>उपर्युक्त में से कोई नहीं</span><span class="mark"></span></button>
  </section>
  <div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div>
  <div class="actions">
    <button class="primary" id="answerBtn" type="button">See Answer</button>
    <button class="secondary" id="resetBtn" type="button">Try Again</button>
  </div>
  <div id="explanation" class="explanation hidden">
    <strong>सही उत्तर: (A) L1</strong><br>
    आदित्य-L1 को सूर्य-पृथ्वी प्रणाली के L1 (लैग्रेंज बिंदु 1) के आसपास Halo Orbit में स्थापित किया गया है। इस स्थान से यह सूर्य का लगातार अवलोकन कर सकता है।
  </div>
  <footer class="footer">ARSHAD ALAM · BPSC TRE PREPARATION</footer>
</main>
<script>
const correctAnswer = "A";
const optionButtons = [...document.querySelectorAll(".option")];
const feedback = document.getElementById("feedback");
const explanation = document.getElementById("explanation");
const answerBtn = document.getElementById("answerBtn");
let selected = null;

function choose(answer){
  selected = answer;
  optionButtons.forEach(btn=>{
    const value = btn.dataset.answer;
    btn.classList.remove("correct","wrong");
    btn.querySelector(".mark").textContent = "";
    if(value === correctAnswer){
      btn.classList.add("correct");
      btn.querySelector(".mark").textContent = "✓";
    } else if(value === selected){
      btn.classList.add("wrong");
      btn.querySelector(".mark").textContent = "✕";
    }
  });
  feedback.classList.remove("hidden","good","bad");
  if(answer === correctAnswer){
    feedback.classList.add("good");
    feedback.innerHTML = "<strong>✓ सही जवाब! Well done.</strong><br>आपका उत्तर सही है।";
  }else{
    feedback.classList.add("bad");
    feedback.innerHTML = "<strong>✕ गलत जवाब!</strong><br>सही उत्तर है: (A) L1. फिर से प्रयास करें।";
  }
}
optionButtons.forEach(btn=>btn.addEventListener("click",()=>choose(btn.dataset.answer)));
answerBtn.addEventListener("click",()=>{
  explanation.classList.toggle("hidden");
  answerBtn.textContent = explanation.classList.contains("hidden") ? "See Answer" : "Hide Answer";
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  selected = null;
  optionButtons.forEach(btn=>{btn.classList.remove("correct","wrong");btn.querySelector(".mark").textContent="";});
  feedback.classList.add("hidden");
  explanation.classList.add("hidden");
  answerBtn.textContent = "See Answer";
});
document.getElementById("themeBtn").addEventListener("click",()=>{
  document.body.classList.toggle("night");
  document.getElementById("themeBtn").textContent = document.body.classList.contains("night") ? "☀️ Day" : "🌙 Night";
});
</script>
</body>
</html>
